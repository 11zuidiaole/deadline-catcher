<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadline 清单</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--muted:#8a8a8e;--line:#ebe8e1;
  --accent:#e39a0b;--accent-soft:#fdf4de;--red:#d93a2b;--red-soft:#fdecea;
  --orange:#c76a00;--orange-soft:#fff1e0;--green:#2e9a5b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.stat{font-size:13px;padding:4px 10px;border-radius:99px;background:#ecebe6;color:#55555a}
.stat.over{background:var(--red-soft);color:var(--red)}
.stat.today{background:var(--orange-soft);color:var(--orange)}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:#55555a}
.toolbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.legend{margin-left:auto;color:var(--muted)}
.btn-primary{background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500}
.btn-primary:hover{opacity:.88}

.project{background:var(--card);border-radius:14px;padding:14px 14px 10px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--line)}
.node{position:relative}
.row{display:flex;align-items:center;gap:8px;min-height:36px;position:relative}
.d1>.row,.d2>.row{border-top:1px solid var(--line)}
.kids{margin-left:30px}
.d0>.kids{margin-left:22px}
.caret{width:14px;color:var(--muted);font-size:11px;transition:transform .15s;flex:none}
.caret.open{transform:rotate(90deg)}
.caret-sp{width:14px;flex:none}
.circle{width:22px;height:22px;flex:none;display:grid;place-items:center}
.d0>.row .circle{width:24px;height:24px}
.circle svg{width:100%;height:100%}
.c-ring{fill:none;stroke:#c7c7cc;stroke-width:1.6}
.circle:hover .c-ring{stroke:var(--accent)}
.c-half{fill:var(--accent)}
.half .c-ring{stroke:var(--accent)}
.c-fill{fill:var(--accent)}
.c-check{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.title{flex:1;min-width:0;border:0;background:none;outline:none;padding:6px 0}
.d0>.row .title{font-size:18px;font-weight:600}
.done>.row .title{color:var(--muted);text-decoration:line-through;text-decoration-color:#c7c7cc}
.count{font-size:12px;color:var(--muted);flex:none}
.due{flex:none;font-size:12.5px;padding:3px 9px;border-radius:99px;background:#f1f0ec;color:#55555a;white-space:nowrap}
.due.empty{background:none;color:#b0b0b5;border:1px dashed #d6d4cd}
.due.soon{background:var(--orange-soft);color:var(--orange)}
.due.over{background:var(--red-soft);color:var(--red);font-weight:500}
.due.isdone{background:none;color:#b0b0b5;text-decoration:line-through}
.more{flex:none;width:26px;height:26px;border-radius:7px;color:var(--muted);font-size:18px;line-height:1}
.more:hover{background:#f1f0ec}
.menu{position:absolute;right:0;top:34px;z-index:20;background:#fff;border-radius:10px;padding:5px;min-width:170px;
  box-shadow:0 8px 28px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.menu button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:14px}
.menu button:hover{background:#f4f3ef}
.menu .danger{color:var(--red)}
.bar{height:4px;border-radius:4px;background:#efede7;margin:2px 0 6px 46px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}

.panel{margin:2px 0 8px 52px}
.d0>.panel{margin-left:46px}
.due-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:#faf9f6;
  border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.due-edit input{border:1px solid #dedbd3;border-radius:7px;padding:4px 6px;background:#fff}
.hint{color:var(--muted)}
.link{color:#2f6fde;font-size:13px}
.note{width:100%;border:0;outline:none;resize:none;background:none;color:#55555a;font-size:14px;padding:0;overflow:hidden;min-height:22px}
.half-box{background:var(--accent-soft);border-radius:10px;padding:9px 11px}
.half-box .lab{font-size:12px;color:#8a6a1f;font-weight:600;margin-bottom:2px}
.half-box textarea{width:100%;border:0;outline:none;resize:none;background:none;font-size:14px;padding:0;overflow:hidden;min-height:22px}
.eta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#8a6a1f;margin-top:6px}
.eta input{border:1px solid #ecd9a8;border-radius:7px;padding:3px 6px;background:#fffdf6}
.warn{color:var(--red);font-size:12.5px}
.add{display:block;color:var(--muted);font-size:14px;padding:7px 0 4px 30px}
.add:hover{color:var(--accent)}
.d0>.kids>.add{padding-left:30px}
.empty-state{text-align:center;color:var(--muted);padding:60px 20px;border:1.5px dashed #dcd9d0;border-radius:14px}
.empty-state b{color:var(--ink)}
.sync{font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .legend{margin-left:0;width:100%}
  .kids{margin-left:18px}.d0>.kids{margin-left:10px}
  .panel{margin-left:40px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Deadline</h1>
      <div class="sub"><span id="sync" class="sync">加载中…</span></div>
    </div>
    <button class="btn-primary" data-act="newProject">＋ 新建项目</button>
  </header>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <label><input type="checkbox" id="sortDue"> 按 deadline 排序</label>
    <label><input type="checkbox" id="hideDone"> 隐藏已完成</label>
    <span class="legend">点圆圈切换：○ 未开始 → ◐ 进行中 → ● 完成</span>
  </div>
  <div id="app"></div>
</div>

<script>
const LS = 'ddl-board-v1';
let state = { items: [], updatedAt: 0, prefs: { hideDone: false, sortDue: false } };
const ui = { editDue: null, menu: null, confirmDel: null, focus: null };

const $ = s => document.querySelector(s);
const app = $('#app');
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk = () => ({ id: uid(), title: '', note: '', showNote: false, due: '', time: '', status: 'todo',
  progress: '', eta: '', etaTime: '', children: [], collapsed: false });

function normalize(s) {
  const fix = n => { const b = Object.assign(mk(), n); b.children = (n.children || []).map(fix); return b; };
  return { items: (s.items || []).map(fix), updatedAt: s.updatedAt || 0,
    prefs: Object.assign({ hideDone: false, sortDue: false }, s.prefs || {}) };
}
try { const raw = localStorage.getItem(LS); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {}

function find(id, list = state.items, depth = 0, parent = null) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { node: list[i], list, index: i, depth, parent };
    const r = find(id, list[i].children, depth + 1, list[i]);
    if (r) return r;
  }
  return null;
}
function walk(fn, list = state.items, depth = 0) { list.forEach(n => { fn(n, depth); walk(fn, n.children, depth + 1); }); }

/* ---------- time helpers ---------- */
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function dueDate(date, time) { return date ? new Date(date + 'T' + (time || '23:59')) : null; }
function dayLabel(date) {
  const d = new Date(date + 'T00:00'), now = new Date();
  const dd = Math.round((sod(d) - sod(now)) / 864e5);
  if (dd === 0) return '今天';
  if (dd === 1) return '明天';
  if (dd === -1) return '昨天';
  if (dd > 1 && dd < 7) return WEEK[d.getDay()];
  const md = `${d.getMonth() + 1}月${d.getDate()}日`;
  return d.getFullYear() === now.getFullYear() ? md : `${d.getFullYear()}年${md}`;
}
function dueInfo(n) {
  if (!n.due) return { label: '＋ deadline', cls: 'empty' };
  const d = dueDate(n.due, n.time), now = new Date();
  const dd = Math.round((sod(d) - sod(now)) / 864e5);
  let label = dayLabel(n.due) + ' ' + (n.time || '23:59');
  if (n.status === 'done') return { label, cls: 'isdone' };
  if (d < now) {
    const late = Math.max(0, Math.round((sod(now) - sod(d)) / 864e5));
    return { label: (late ? `逾期 ${late} 天 · ` : '已过 · ') + label, cls: 'over' };
  }
  if (dd <= 1) return { label, cls: 'soon' };
  if (dd < 7) return { label: label + ` · 还剩 ${dd} 天`, cls: '' };
  return { label, cls: '' };
}

/* ---------- render ---------- */
function circleSvg(s) {
  if (s === 'done') return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" class="c-fill"/><path d="M7.4 12.4l3.1 3.1 6.1-6.6" class="c-check"/></svg>';
  if (s === 'half') return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" class="c-ring"/><path d="M12 2 A10 10 0 0 0 12 22 Z" class="c-half"/></svg>';
  return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" class="c-ring"/></svg>';
}
const STATUS_TIP = { todo: '未开始（点一下 → 进行中）', half: '进行中（点一下 → 完成）', done: '已完成（点一下 → 重置）' };
const PH = ['项目标题', 'Task', '子项'];
const ADD = ['＋ 添加 task', '＋ 添加子项'];

function orderKids(list) {
  let arr = list.slice();
  if (state.prefs.hideDone) arr = arr.filter(n => n.status !== 'done');
  if (state.prefs.sortDue) {
    arr.sort((a, b) => {
      const da = a.status === 'done', db_ = b.status === 'done';
      if (da !== db_) return da ? 1 : -1;
      const x = dueDate(a.due, a.time), y = dueDate(b.due, b.time);
      if (!x && !y) return 0; if (!x) return 1; if (!y) return -1;
      return x - y;
    });
  }
  return arr;
}
function score(list) {
  if (!list.length) return null;
  const s = list.reduce((t, n) => t + (n.status === 'done' ? 1 : n.status === 'half' ? .5 : 0), 0);
  return { s, total: list.length, pct: Math.round(s / list.length * 100) };
}

function renderNode(n, depth) {
  const di = dueInfo(n);
  const hasKids = n.children.length > 0;
  const sc = score(n.children);
  const open = !n.collapsed;
  let h = `<div class="node d${depth} ${n.status}" data-id="${n.id}">`;
  h += `<div class="row">`;
  h += hasKids ? `<button class="caret ${open ? 'open' : ''}" data-act="collapse" title="展开/收起">▶</button>` : `<span class="caret-sp"></span>`;
  h += `<button class="circle" data-act="cycle" title="${STATUS_TIP[n.status]}">${circleSvg(n.status)}</button>`;
  h += `<input class="title" data-field="title" value="${esc(n.title)}" placeholder="${PH[depth]}">`;
  if (sc) h += `<span class="count">${fmt(sc.s)}/${sc.total}</span>`;
  h += `<button class="due ${di.cls}" data-act="due">${esc(di.label)}</button>`;
  h += `<button class="more" data-act="menu" title="更多">⋯</button>`;
  if (ui.menu === n.id) {
    h += `<div class="menu">`;
    if (depth < 2) h += `<button data-act="addChild">${ADD[depth]}</button>`;
    h += `<button data-act="toggleNote">${n.showNote ? '隐藏说明' : '添加说明'}</button>`;
    h += `<button data-act="due">设置 deadline</button>`;
    if (n.status !== 'half') h += `<button data-act="setHalf">标记为进行中 ◐</button>`;
    h += `<button class="danger" data-act="delete">${ui.confirmDel === n.id ? '再点一次确认删除' : '删除' + (hasKids ? '（含子项）' : '')}</button>`;
    h += `</div>`;
  }
  h += `</div>`;
  if (depth === 0 && sc) h += `<div class="bar"><i style="width:${sc.pct}%"></i></div>`;

  if (ui.editDue === n.id) {
    h += `<div class="panel"><div class="due-edit">
      <span>截止</span>
      <input type="date" data-field="due" value="${esc(n.due)}">
      <input type="time" data-field="time" value="${esc(n.time)}">
      <span class="hint">${n.time ? '' : '不填时间 = 23:59'}</span>
      ${n.time ? '<button class="link" data-act="clearTime">用默认 23:59</button>' : ''}
      ${n.due ? '<button class="link" data-act="clearDue">清除</button>' : ''}
      <button class="link" data-act="closeDue" style="margin-left:auto">完成</button>
    </div></div>`;
  }
  if (n.showNote || n.note) {
    h += `<div class="panel"><textarea class="note" rows="1" data-field="note" placeholder="说明 / 细节…">${esc(n.note)}</textarea></div>`;
  }
  if (n.status === 'half') {
    let warn = '';
    const e = dueDate(n.eta, n.etaTime), d = dueDate(n.due, n.time);
    if (e && d && e > d) warn = `<span class="warn">⚠ 预计晚于 deadline</span>`;
    h += `<div class="panel"><div class="half-box">
      <div class="lab">◐ 进度</div>
      <textarea rows="1" data-field="progress" placeholder="现在做到哪了？还差什么？">${esc(n.progress)}</textarea>
      <div class="eta">预计完成
        <input type="date" data-field="eta" value="${esc(n.eta)}">
        <input type="time" data-field="etaTime" value="${esc(n.etaTime)}">
        ${warn}
      </div>
    </div></div>`;
  }
  if (depth < 2 && open && (hasKids || depth === 0)) {
    h += `<div class="kids">`;
    h += orderKids(n.children).map(c => renderNode(c, depth + 1)).join('');
    h += `<button class="add" data-act="addChild">${ADD[depth]}</button>`;
    h += `</div>`;
  } else if (hasKids && open) {
    h += `<div class="kids">${orderKids(n.children).map(c => renderNode(c, depth + 1)).join('')}</div>`;
  }
  return h + `</div>`;
}
const fmt = x => Number.isInteger(x) ? x : x.toFixed(1);

function renderStats() {
  let over = 0, today = 0, week = 0, doing = 0;
  const now = new Date();
  walk(n => {
    if (n.status === 'half') doing++;
    if (n.status === 'done' || !n.due) return;
    const d = dueDate(n.due, n.time);
    const dd = Math.round((sod(d) - sod(now)) / 864e5);
    if (d < now) over++; else if (dd === 0) today++; else if (dd < 7) week++;
  });
  $('#stats').innerHTML =
    (over ? `<span class="stat over">逾期 ${over}</span>` : '') +
    `<span class="stat today">今天到期 ${today}</span>` +
    `<span class="stat">7 天内 ${week}</span>` +
    `<span class="stat">进行中 ◐ ${doing}</span>`;
}

function render() {
  const list = orderKids(state.items);
  app.innerHTML = list.length ? list.map(n => `<div class="project">${renderNode(n, 0)}</div>`).join('')
    : (state.items.length ? `<div class="empty-state">全部完成了 🎉</div>`
      : `<div class="empty-state">还没有项目<br><br>点右上角 <b>＋ 新建项目</b>，写一个标题，再往里加 task</div>`);
  $('#sortDue').checked = state.prefs.sortDue;
  $('#hideDone').checked = state.prefs.hideDone;
  renderStats();
  app.querySelectorAll('textarea').forEach(autosize);
  if (ui.focus) {
    const el = app.querySelector(`[data-id="${ui.focus.id}"] ${ui.focus.sel}`);
    ui.focus = null;
    if (el) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
  }
}
function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

/* ---------- actions ---------- */
function addChild(id) {
  const f = find(id); if (!f || f.depth >= 2) return;
  const c = mk(); f.node.children.push(c); f.node.collapsed = false;
  ui.focus = { id: c.id, sel: '.title' };
}
function addSiblingAfter(id) {
  const f = find(id); if (!f) return;
  const c = mk(); f.list.splice(f.index + 1, 0, c);
  ui.focus = { id: c.id, sel: '.title' };
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const nodeEl = b.closest('.node'); const id = nodeEl && nodeEl.dataset.id;
  const f = id && find(id); const n = f && f.node;
  const act = b.dataset.act;
  if (act !== 'delete') ui.confirmDel = null;
  if (act !== 'menu' && act !== 'delete') ui.menu = null;
  switch (act) {
    case 'cycle':
      n.status = n.status === 'todo' ? 'half' : n.status === 'half' ? 'done' : 'todo';
      if (n.status === 'half' && !n.progress) ui.focus = { id, sel: '.half-box textarea' };
      break;
    case 'setHalf': n.status = 'half'; ui.focus = { id, sel: '.half-box textarea' }; break;
    case 'collapse': n.collapsed = !n.collapsed; break;
    case 'due':
      ui.editDue = ui.editDue === id ? null : id;
      break;
    case 'closeDue': ui.editDue = null; break;
    case 'clearTime': n.time = ''; break;
    case 'clearDue': n.due = ''; n.time = ''; ui.editDue = null; break;
    case 'menu': ui.menu = ui.menu === id ? null : id; ui.confirmDel = null; render(); return;
    case 'toggleNote':
      n.showNote = !n.showNote; if (!n.showNote) n.note = '';
      if (n.showNote) ui.focus = { id, sel: '.note' };
      break;
    case 'addChild': addChild(id); break;
    case 'delete':
      if (ui.confirmDel !== id) { ui.confirmDel = id; render(); return; }
      f.list.splice(f.index, 1); ui.menu = null; ui.confirmDel = null;
      break;
    default: return;
  }
  save(); render();
  if (act === 'due' && ui.editDue === id && !n.due) {
    const inp = app.querySelector(`[data-id="${id}"] .due-edit input[type=date]`);
    if (inp) { inp.focus(); try { inp.showPicker(); } catch (_) {} }
  }
});
document.querySelector('[data-act="newProject"]').addEventListener('click', () => {
  const p = mk(); state.items.unshift(p); ui.focus = { id: p.id, sel: '.title' }; save(); render();
});
document.addEventListener('click', e => {
  if (ui.menu && !e.target.closest('.menu') && !e.target.closest('[data-act="menu"]')) {
    ui.menu = null; ui.confirmDel = null; render();
  }
});

// text: update silently; dates/times: re-render on change
app.addEventListener('input', e => {
  const el = e.target, field = el.dataset.field; if (!field) return;
  const f = find(el.closest('.node').dataset.id); if (!f) return;
  if (el.type === 'date' || el.type === 'time') return;
  f.node[field] = el.value;
  if (el.tagName === 'TEXTAREA') autosize(el);
  save();
});
app.addEventListener('change', e => {
  const el = e.target, field = el.dataset.field; if (!field) return;
  if (el.type !== 'date' && el.type !== 'time') return;
  const f = find(el.closest('.node').dataset.id); if (!f) return;
  f.node[field] = el.value;
  save(); render();
});
app.addEventListener('keydown', e => {
  const el = e.target;
  if (!el.classList.contains('title') || e.key !== 'Enter' || e.isComposing) return;
  e.preventDefault();
  const f = find(el.closest('.node').dataset.id); if (!f) return;
  if (f.depth === 0) addChild(f.node.id); else addSiblingAfter(f.node.id);
  save(); render();
});
$('#sortDue').addEventListener('change', e => { state.prefs.sortDue = e.target.checked; save(); render(); });
$('#hideDone').addEventListener('change', e => { state.prefs.hideDone = e.target.checked; save(); render(); });

/* ---------- saving: this browser ---------- */
const setSync = t => { $('#sync').textContent = t; };
function save() {
  state.updatedAt = Date.now();
  try { localStorage.setItem(LS, JSON.stringify(state)); setSync('已自动保存在本浏览器'); }
  catch (e) { setSync('浏览器不允许保存，刷新后会丢失'); }
}
setSync('已自动保存在本浏览器');

render();
</script>
</body>
</html>
