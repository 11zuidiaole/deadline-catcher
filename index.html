<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadline 清单</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1d1d1f;--muted:#8a8a8e;--line:#ebe8e1;
  --accent:#e39a0b;--accent-soft:#fdf4de;--red:#d93a2b;--red-soft:#fdecea;
  --orange:#c76a00;--orange-soft:#fff1e0;--green:#2e9a5b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.stat{font-size:13px;padding:4px 10px;border-radius:99px;background:#ecebe6;color:#55555a}
.stat.over{background:var(--red-soft);color:var(--red)}
.stat.today{background:var(--orange-soft);color:var(--orange)}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:#55555a}
.toolbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.legend{margin-left:auto;color:var(--muted)}
.btn-primary{background:var(--ink);color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:500}
.btn-primary:hover{opacity:.88}

.project{background:var(--card);border-radius:14px;padding:14px 14px 10px;margin-bottom:14px;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px var(--line)}
.node{position:relative}
.row{display:flex;align-items:center;gap:8px;min-height:36px;position:relative}
.d1>.row,.d2>.row{border-top:1px solid var(--line)}
.kids{margin-left:30px}
.d0>.kids{margin-left:22px}
.caret{width:14px;color:var(--muted);font-size:11px;transition:transform .15s;flex:none}
.caret.open{transform:rotate(90deg)}
.caret-sp{width:14px;flex:none}
.circle{width:22px;height:22px;flex:none;display:grid;place-items:center}
.d0>.row .circle{width:24px;height:24px}
.circle svg{width:100%;height:100%}
.c-ring{fill:none;stroke:#c7c7cc;stroke-width:1.6}
.circle:hover .c-ring{stroke:var(--accent)}
.c-half{fill:var(--accent)}
.half>.row .c-ring{stroke:var(--accent)}
.c-fill{fill:var(--accent)}
.c-check{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.title{flex:1;min-width:0;border:0;background:none;outline:none;padding:6px 0}
.d0>.row .title{font-size:18px;font-weight:600}
.done>.row .title{color:var(--muted);text-decoration:line-through;text-decoration-color:#c7c7cc}
.count{font-size:12px;color:var(--muted);flex:none}
.due{flex:none;font-size:12.5px;padding:3px 9px;border-radius:99px;background:#f1f0ec;color:#55555a;white-space:nowrap}
.due.empty{background:none;color:#b0b0b5;border:1px dashed #d6d4cd}
.due.soon{background:var(--orange-soft);color:var(--orange)}
.due.over{background:var(--red-soft);color:var(--red);font-weight:500}
.due.isdone{background:none;color:#b0b0b5;text-decoration:line-through}
.more{flex:none;width:26px;height:26px;border-radius:7px;color:var(--muted);font-size:18px;line-height:1}
.more:hover{background:#f1f0ec}
.menu{position:absolute;right:0;top:34px;z-index:20;background:#fff;border-radius:10px;padding:5px;min-width:170px;
  box-shadow:0 8px 28px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.menu button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:14px}
.menu button:hover{background:#f4f3ef}
.menu .danger{color:var(--red)}
.bar{height:4px;border-radius:4px;background:#efede7;margin:2px 0 6px 46px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}

.panel{margin:2px 0 8px 52px}
.d0>.panel{margin-left:46px}
.due-edit{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;background:#faf9f6;
  border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.due-edit input{border:1px solid #dedbd3;border-radius:7px;padding:4px 6px;background:#fff}
.hint{color:var(--muted)}
.link{color:#2f6fde;font-size:13px}
.note{width:100%;border:0;outline:none;resize:none;background:none;color:#55555a;font-size:14px;padding:0;overflow:hidden;min-height:22px}
.half-box{background:var(--accent-soft);border-radius:10px;padding:9px 11px}
.half-box .lab{font-size:12px;color:#8a6a1f;font-weight:600;margin-bottom:2px}
.half-box textarea{width:100%;border:0;outline:none;resize:none;background:none;font-size:14px;padding:0;overflow:hidden;min-height:22px}
.eta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:#8a6a1f;margin-top:6px}
.eta input{border:1px solid #ecd9a8;border-radius:7px;padding:3px 6px;background:#fffdf6}
.warn{color:var(--red);font-size:12.5px}
.add{display:block;color:var(--muted);font-size:14px;padding:7px 0 4px 30px}
.add:hover{color:var(--accent)}
.d0>.kids>.add{padding-left:30px}
.empty-state{text-align:center;color:var(--muted);padding:60px 20px;border:1.5px dashed #dcd9d0;border-radius:14px}
.empty-state b{color:var(--ink)}
.sync{font-size:12px;color:var(--muted)}
@media (max-width:560px){
  .legend{margin-left:0;width:100%}
  .kids{margin-left:18px}.d0>.kids{margin-left:10px}
  .panel{margin-left:40px}
}

.head-btns{display:flex;gap:8px}
.btn-ghost{border:1px solid #d6d4cd;border-radius:10px;padding:7px 13px;font-size:14px;background:#fff}
.btn-ghost:hover{background:#f4f3ef}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;padding:18px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal .tip{color:var(--muted);font-size:13px;margin-bottom:10px}
.imp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imp-grid textarea{width:100%;height:360px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;resize:vertical;background:#faf9f6;outline:none}
.pv{height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.pv-row{display:flex;align-items:center;gap:7px;min-height:30px;font-size:14px}
.pv-row.t{font-weight:700;font-size:15.5px;margin-top:6px}
.pv-row.k{padding-left:22px}
.pv-row .circle{width:18px;height:18px}
.pv-row .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-row.k.done .txt{color:var(--muted);text-decoration:line-through}
.pv-chip{font-size:12px;padding:1px 8px;border-radius:99px;background:#f1f0ec;color:#55555a;white-space:nowrap}
.pv-type{font-size:11.5px;color:#2f6fde;white-space:nowrap}
.pv-empty{color:var(--muted);font-size:13px;padding:20px 4px}
.modal-foot{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.modal-foot .sum{color:#55555a;font-size:13px;margin-right:auto}
@media (max-width:640px){.imp-grid{grid-template-columns:1fr}.imp-grid textarea,.pv{height:220px}}

.sub#today{font-size:15px;color:#55555a;margin-top:4px}
.foot{text-align:center;margin-top:24px}
.stats:empty{display:none}
.toolbar{color:var(--muted)}
.due.empty,.more,.addsub{opacity:0;transition:opacity .12s}
.row:hover .due.empty,.row:hover .more,.row:hover .addsub,
.row:focus-within .due.empty,.row:focus-within .more,.row:focus-within .addsub,
.row.menu-open .more{opacity:1}
@media (hover:none){.due.empty,.more,.addsub{opacity:1}}
.addsub{flex:none;font-size:12.5px;color:var(--muted);padding:3px 8px;border-radius:99px}
.addsub:hover{background:#f1f0ec;color:var(--accent)}
.add{opacity:.7}.add:hover{opacity:1}
.project{padding-bottom:6px}
.d1>.kids .add{padding-left:30px;font-size:13px}

.d3>.row,.d4>.row{border-top:1px solid var(--line)}
.node:not(.d0)>.kids .add{padding-left:30px;font-size:13px}
.picker{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);margin-top:6px}
.pk-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.pk-date{flex:1;min-width:180px;border:1px solid #dedbd3;border-radius:8px;padding:6px 10px;font-size:14px;outline:none;background:#faf9f6}
.pk-date:focus{border-color:var(--accent);background:#fff}
.pk-hint{font-size:13px;color:#8a6a1f}
.pk-hint.bad{color:var(--red)}
.pk-body{display:flex;gap:18px;flex-wrap:wrap}
.cal{width:238px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;font-size:14px}
.cal-h button{width:28px;height:28px;border-radius:7px;font-size:16px;color:#55555a}
.cal-h button:hover{background:#f4f3ef}
.cal-w,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-w span{font-size:11.5px;color:var(--muted);padding:2px 0}
.cal-g button,.cal-g span{height:32px;font-size:13.5px;border-radius:8px}
.cal-g button:hover{background:var(--accent-soft)}
.cal-g button.past{color:#bbb}
.cal-g button.today{box-shadow:inset 0 0 0 1.5px var(--accent);color:#8a6a1f;font-weight:600}
.cal-g button.sel{background:var(--accent);color:#fff;font-weight:600;box-shadow:none}
.tm{flex:1;min-width:220px}
.tm-lab{font-size:12px;color:var(--muted);margin:2px 0 6px}
.tm-g{display:grid;gap:4px;margin-bottom:8px}
.tm-g button,.tm-def{height:30px;border-radius:8px;font-size:13.5px;background:#f6f5f1}
.tm-g button:hover,.tm-def:hover{background:var(--accent-soft)}
.tm-g button.on,.tm-def.on{background:var(--accent);color:#fff;font-weight:600}
.tm-h{grid-template-columns:repeat(6,1fr)}
.tm-m{grid-template-columns:repeat(4,1fr)}
.tm-ap{grid-template-columns:repeat(2,1fr)}
.tm-def{width:100%;margin-top:2px}
.pk-foot{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:10px}
.pk-done{background:var(--ink);color:#fff;border-radius:8px;padding:5px 14px;font-size:13.5px}
.eta-chip{border:1px solid #ecd9a8;background:#fffdf6;border-radius:99px;padding:2px 10px;font-size:13px;color:#8a6a1f}

.modal.small{max-width:430px}
.field{width:100%;border:1px solid #dedbd3;border-radius:9px;padding:9px 11px;font-size:14.5px;margin-bottom:8px;outline:none;background:#faf9f6}
.field:focus{border-color:var(--accent);background:#fff}
.auth-msg{font-size:13px;min-height:18px;color:#8a6a1f}
.auth-msg.bad{color:var(--red)}
.foot .sync button{color:#8a6a1f;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.hist{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.hist-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}
.hist-row:first-child{border-top:0}
.hist-row .when{flex:1}
.hist-row .what{color:var(--muted);font-size:12.5px}
.hist-row button{font-size:13px;color:#8a6a1f;border:1px solid #ecd9a8;border-radius:99px;padding:2px 10px;background:#fffdf6}
.choice{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choice button{text-align:left;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.choice button:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice small{display:block;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Deadline</h1>
      <div class="sub" id="today"></div>
    </div>
    <div class="head-btns"><button class="btn-ghost" data-act="import">粘贴导入</button><button class="btn-primary" data-act="newProject">＋ 新建项目</button></div>
  </header>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <label><input type="checkbox" id="sortDue"> 按 deadline 排序</label>
    <label><input type="checkbox" id="hideDone"> 隐藏已完成</label>
  </div>
  <div id="app"></div>
  <div class="foot"><span id="sync" class="sync"></span></div>
</div>


<div class="modal-bg" id="impBg">
  <div class="modal">
    <h2>粘贴导入</h2>
    <div class="tip">从备忘录整段复制过来直接粘贴。课程号 / 粗体行会被当成标题，像 Nov20、Nov 15、11/20、11月20日 这样的日期会变成 deadline（默认 23:59）。右边是预览：点圆圈改完成状态，点「设为标题 / 设为 task」改类型。</div>
    <div class="imp-grid">
      <textarea id="impText" placeholder="5559&#10;M7-1 Nov20&#10;Lab6 Nov15&#10;5540&#10;Quiz5 Nov17&#10;Written Proposal Dec1"></textarea>
      <div class="pv" id="impPv"></div>
    </div>
    <div class="modal-foot">
      <span class="sum" id="impSum"></span>
      <button class="btn-ghost" id="impCancel">取消</button>
      <button class="btn-primary" id="impOk">导入</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="authBg">
  <div class="modal small">
    <h2>登录同步</h2>
    <div class="tip">手机和电脑登录同一个账号，数据会自动同步。第一次用先填邮箱和密码点「注册」。</div>
    <input class="field" id="authEmail" type="email" placeholder="邮箱" autocomplete="email">
    <input class="field" id="authPw" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
    <div class="auth-msg" id="authMsg"></div>
    <div class="modal-foot"><span class="sum"></span>
      <button class="btn-ghost" id="authCancel">取消</button>
      <button class="btn-ghost" id="authUp">注册</button>
      <button class="btn-primary" id="authIn">登录</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="histBg">
  <div class="modal small">
    <h2>历史版本</h2>
    <div class="tip">每 10 分钟最多存一份，保留最近 200 份。恢复前，现在的内容会先存进历史，恢复错了也能换回来。</div>
    <div class="hist" id="histList"></div>
    <div class="modal-foot"><span class="sum"></span><button class="btn-ghost" id="histClose">关闭</button></div>
  </div>
</div>
<div class="modal-bg" id="pickBg">
  <div class="modal small">
    <h2>用哪一份数据？</h2>
    <div class="tip">这台设备上已经有内容，你的账号里也有内容。选一份来用，另一份会存进历史版本，不会丢。</div>
    <div class="choice">
      <button id="useCloud">用账号里的<small id="cloudInfo"></small></button>
      <button id="useLocal">用这台设备上的<small id="localInfo"></small></button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const LS = 'ddl-board-v1';
let state = { items: [], updatedAt: 0, prefs: { hideDone: false, sortDue: false } };
const ui = { pick: null, menu: null, confirmDel: null, focus: null };

const $ = s => document.querySelector(s);
const app = $('#app');
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk = () => ({ id: uid(), title: '', note: '', showNote: false, due: '', time: '', status: 'todo',
  progress: '', eta: '', etaTime: '', children: [], collapsed: false });

function normalize(s) {
  const fix = n => { const b = Object.assign(mk(), n); b.children = (n.children || []).map(fix); return b; };
  return { items: (s.items || []).map(fix), updatedAt: s.updatedAt || 0,
    prefs: Object.assign({ hideDone: false, sortDue: false }, s.prefs || {}) };
}
try { const raw = localStorage.getItem(LS); if (raw) state = normalize(JSON.parse(raw)); } catch (e) {}

function find(id, list = state.items, depth = 0, parent = null) {
  for (let i = 0; i < list.length; i++) {
    if (list[i].id === id) return { node: list[i], list, index: i, depth, parent };
    const r = find(id, list[i].children, depth + 1, list[i]);
    if (r) return r;
  }
  return null;
}
function walk(fn, list = state.items, depth = 0) { list.forEach(n => { fn(n, depth); walk(fn, n.children, depth + 1); }); }

/* ---------- time helpers ---------- */
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function dueDate(date, time) { return date ? new Date(date + 'T' + (time || '23:59')) : null; }
function dayLabel(date) {
  const d = new Date(date + 'T00:00'), now = new Date();
  const dd = Math.round((sod(d) - sod(now)) / 864e5);
  if (dd === 0) return '今天';
  if (dd === 1) return '明天';
  if (dd === -1) return '昨天';
  if (dd > 1 && dd < 7) return WEEK[d.getDay()];
  const md = `${d.getMonth() + 1}月${d.getDate()}日`;
  return d.getFullYear() === now.getFullYear() ? md : `${d.getFullYear()}年${md}`;
}
function fullDate(date) {
  const d = new Date(date + 'T00:00'), now = new Date();
  const md = `${d.getMonth() + 1}月${d.getDate()}日 ${WEEK[d.getDay()]}`;
  return d.getFullYear() === now.getFullYear() ? md : `${d.getFullYear()}年${md}`;
}
function dueInfo(n) {
  if (!n.due) return { label: '＋ deadline', cls: 'empty' };
  const d = dueDate(n.due, n.time), now = new Date();
  const dd = Math.round((sod(d) - sod(now)) / 864e5);
  let label = fullDate(n.due);
  if (n.time && n.time !== '23:59') label += ' ' + fmt12(n.time);
  if (n.status === 'done') return { label, cls: 'isdone' };
  if (d < now) return { label: label + (dd < 0 ? ` · 逾期 ${-dd} 天` : ' · 已过时间'), cls: 'over' };
  if (dd === 0) return { label: label + ' · 今天截止', cls: 'soon' };
  if (dd === 1) return { label: label + ' · 明天截止', cls: 'soon' };
  return { label: label + ` · 还有 ${dd} 天`, cls: dd <= 3 ? 'soon' : '' };
}

/* ---------- render ---------- */
function circleSvg(s) {
  if (s === 'done') return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" class="c-fill"/><path d="M7.4 12.4l3.1 3.1 6.1-6.6" class="c-check"/></svg>';
  if (s === 'half') return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" class="c-ring"/><path d="M12 2 A10 10 0 0 0 12 22 Z" class="c-half"/></svg>';
  return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" class="c-ring"/></svg>';
}
const STATUS_TIP = { todo: '未开始（点一下 → 进行中）', half: '进行中（点一下 → 完成）', done: '已完成（点一下 → 重置）' };
const PH = ['项目标题', 'Task', '子项'];
const ADD = ['＋ 添加 task', '＋ 添加子项'];

function orderKids(list) {
  let arr = list.slice();
  if (state.prefs.hideDone) arr = arr.filter(n => n.status !== 'done');
  if (state.prefs.sortDue) {
    arr.sort((a, b) => {
      const da = a.status === 'done', db_ = b.status === 'done';
      if (da !== db_) return da ? 1 : -1;
      const x = dueDate(a.due, a.time), y = dueDate(b.due, b.time);
      if (!x && !y) return 0; if (!x) return 1; if (!y) return -1;
      return x - y;
    });
  }
  return arr;
}
function score(list) {
  if (!list.length) return null;
  const s = list.reduce((t, n) => t + (n.status === 'done' ? 1 : n.status === 'half' ? .5 : 0), 0);
  return { s, total: list.length, pct: Math.round(s / list.length * 100) };
}

function renderNode(n, depth) {
  const di = dueInfo(n);
  const hasKids = n.children.length > 0;
  const sc = score(n.children);
  const open = !n.collapsed;
  let h = `<div class="node d${depth} ${n.status}" data-id="${n.id}">`;

/* ---------- paste import ---------- */
const MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const pad = x => String(x).padStart(2, '0');
function mkDate(m, d) {
  m = +m; d = +d; if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return '';
  const now = new Date(); let y = now.getFullYear();
  if (new Date(y, m - 1, d) < new Date(now.getFullYear(), now.getMonth(), now.getDate() - 120)) y++;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function parseDate(s) {
  let due = '', time = '', rest = s, m;
  const pats = [
    [/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*(\d{1,2})(?:st|nd|rd|th)?(?!\d)/i, m => mkDate(MON[m[1].toLowerCase().slice(0,3)], m[2])],
    [/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/, m => mkDate(m[1], m[2])],
    [/(?<![\d\/])(?<![Ww][Ee]?[Ee]?[Kk]\.?\s*)(\d{1,2})\/(\d{1,2})(?![\d\/])/, m => mkDate(m[1], m[2])],
  ];
  for (const [re, fn] of pats) { m = rest.match(re); if (m) { const d = fn(m); if (d) { due = d; rest = rest.replace(m[0], ' '); break; } } }
  if (due) {
    m = rest.match(/(?<!\d)(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i) || rest.match(/(?<!\d)(\d{1,2}):(\d{2})(?!\d)/);
    if (m) {
      let h = +m[1]; const mi = +(m[2] || 0); const ap = (m[3] || '').toLowerCase();
      if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0;
      if (h < 24 && mi < 60) { time = pad(h) + ':' + pad(mi); rest = rest.replace(m[0], ' '); }
    }
  }
  rest = rest.replace(/\s+/g, ' ').replace(/^[\s\-–—·,，:：]+|[\s\-–—·,，:：]+$/g, '').trim();
  return { due, time, rest };
}
let impHtml = new Map(), impOv = {};
function htmlFlags(html) {
  const map = new Map();
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.body.querySelectorAll('div,p,li,h1,h2,h3,h4').forEach(el => {
      if (el.querySelector('div,p,li,h1,h2,h3,h4')) return;
      const t = el.textContent.replace(/\s+/g, ' ').trim(); if (!t) return;
      let bold = /^H[1-4]$/.test(el.tagName);
      if (!bold) {
        const b = [...el.querySelectorAll('b,strong')].map(x => x.textContent).join('').replace(/\s+/g, ' ').trim();
        bold = b && b === t;
        if (!bold) { const fs = parseFloat((el.querySelector('[style*="font-size"]') || el).style.fontSize); if (fs >= 18 && el.textContent.trim() === t) bold = true; }
      }
      const li = el.closest('li');
      const checked = !!(li && (/checked|done/i.test(li.className) || li.getAttribute('data-checked') === 'true' || li.getAttribute('aria-checked') === 'true'));
      map.set(t, { bold, checked });
    });
  } catch (e) {}
  return map;
}
function parseLines(text) {
  const out = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    let s = raw.replace(/\s+/g, ' ').trim(); if (!s) return;
    let type = null, done = false;
    const mk = s.match(/^(?:[-*•]\s*)?\[( |x|X|✓)\]\s*/) || s.match(/^([☑✅✓✔☐○◯⭕●◉◐]|[-*•])\s*/);
    if (mk) { type = 'k'; if (/[xX✓✔☑✅●◉]/.test(mk[1])) done = true; s = s.slice(mk[0].length).trim(); }
    let hdr = false;
    if (!type) {
      const hm = s.match(/^#+\s*/); if (hm) { hdr = true; s = s.slice(hm[0].length); }
    }
    const f = impHtml.get(raw.replace(/\s+/g, ' ').trim());
    if (f && f.checked) done = true;
    if (!type) {
      if (hdr || (f && f.bold) || /^[A-Za-z]{0,6}\s?\d{3,5}\b/.test(s) || /[:：]$/.test(s)) type = 't';
      else type = 'k';
    }
    const ov = impOv[i] || {};
    if (ov.type) type = ov.type;
    if (ov.done !== undefined) done = ov.done;
    out.push({ i, raw: s.replace(/[:：]$/, ''), type, done });
  });
  return out;
}
function renderImport() {
  const rows = parseLines($('#impText').value);
  let nt = 0, nk = 0, nd = 0, nDue = 0;
  $('#impPv').innerHTML = rows.length ? rows.map(r => {
    if (r.type === 't') { nt++; return `<div class="pv-row t"><span class="txt">${esc(r.raw)}</span><button class="pv-type" data-i="${r.i}" data-to="k">设为 task</button></div>`; }
    nk++; if (r.done) nd++;
    const p = parseDate(r.raw); if (p.due) nDue++;
    const chip = p.due ? `<span class="pv-chip">${esc(dayLabel(p.due))} ${p.time || '23:59'}</span>` : '';
    return `<div class="pv-row k ${r.done ? 'done' : ''}"><button class="circle" data-i="${r.i}" data-done="${r.done ? 0 : 1}">${circleSvg(r.done ? 'done' : 'todo')}</button><span class="txt">${esc(p.rest || r.raw)}</span>${chip}<button class="pv-type" data-i="${r.i}" data-to="t">设为标题</button></div>`;
  }).join('') : '<div class="pv-empty">把内容粘贴到左边，这里会显示识别结果</div>';
  $('#impSum').textContent = rows.length ? `${nt} 个标题 · ${nk} 个 task（${nDue} 个有日期，${nd} 个已完成）` : '';
  $('#impOk').disabled = !rows.length;
}
function openImport() { $('#impText').value = ''; impHtml = new Map(); impOv = {}; renderImport(); $('#impBg').classList.add('show'); setTimeout(() => $('#impText').focus(), 30); }
function closeImport() { $('#impBg').classList.remove('show'); }
$('#impText').addEventListener('paste', e => {
  const h = e.clipboardData && e.clipboardData.getData('text/html');
  if (h) impHtml = htmlFlags(h);
  impOv = {};
  setTimeout(renderImport, 0);
});
$('#impText').addEventListener('input', () => renderImport());
$('#impPv').addEventListener('click', e => {
  const b = e.target.closest('[data-i]'); if (!b) return;
  const i = +b.dataset.i; impOv[i] = impOv[i] || {};
  if (b.dataset.to) impOv[i].type = b.dataset.to;
  if (b.dataset.done !== undefined) impOv[i].done = b.dataset.done === '1';
  renderImport();
});
$('#impCancel').addEventListener('click', closeImport);
$('#impBg').addEventListener('click', e => { if (e.target.id === 'impBg') closeImport(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#impBg').classList.contains('show')) closeImport(); });
$('#impOk').addEventListener('click', () => {
  const rows = parseLines($('#impText').value); if (!rows.length) return;
  let cur = null;
  const findProj = t => state.items.find(p => p.title.trim().toLowerCase() === t.trim().toLowerCase());
  rows.forEach(r => {
    if (r.type === 't') {
      cur = findProj(r.raw);
      if (!cur) { cur = mk(); cur.title = r.raw; state.items.push(cur); }
      cur.collapsed = false;
      return;
    }
    if (!cur) { cur = findProj('未分类') || (() => { const p = mk(); p.title = '未分类'; state.items.push(p); return p; })(); }
    const p = parseDate(r.raw), t = mk();
    t.title = p.rest || r.raw; t.due = p.due; t.time = p.time; t.status = r.done ? 'done' : 'todo';
    cur.children.push(t);
  });
  save(); render(); closeImport();
});
document.querySelector('[data-act="import"]').addEventListener('click', openImport);

setInterval(() => { const a = document.activeElement; if (!(a && a.matches('input,textarea'))) render(); }, 60000);
render();
</script>
